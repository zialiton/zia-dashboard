<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zia's Automated Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); color: #333; min-height: 100vh; }
        .dashboard-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { background: linear-gradient(135deg, #1a3a3a 0%, #2d5a5a 100%); color: white; padding: 30px 20px; border-radius: 10px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
        header h1 { font-size: 2.5em; margin-bottom: 10px; color: #4ade80; }
        header p { font-size: 1.1em; color: #e0e0e0; }
        .section { background: white; border-radius: 10px; margin-bottom: 25px; padding: 25px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); border-left: 5px solid #16a34a; }
        .section h2 { color: #1a3a3a; margin-bottom: 20px; font-size: 1.8em; display: flex; align-items: center; }
        .section h2::before { content: ''; display: inline-block; width: 10px; height: 10px; background: #16a34a; border-radius: 50%; margin-right: 12px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; flex-wrap: wrap; }
        .tab-button { padding: 10px 20px; background: #f5f5f5; border: none; cursor: pointer; font-size: 1em; border-radius: 5px 5px 0 0; transition: all 0.3s ease; font-weight: 500; }
        .tab-button.active { background: #16a34a; color: white; }
        .tab-button:hover { background: #10b981; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .metric-card { background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%); padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #16a34a; }
        .metric-card h3 { color: #1a3a3a; margin-bottom: 10px; }
        .metric-value { font-size: 2em; color: #16a34a; font-weight: bold; }
        .metric-label { color: #666; font-size: 0.9em; margin-top: 5px; }
        button { padding: 10px 15px; background: #16a34a; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 0.9em; transition: all 0.3s ease; }
        button:hover { background: #10b981; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3); }
        .placeholder { background: #f0f0f0; padding: 30px; border-radius: 8px; text-align: center; color: #999; }
        footer { text-align: center; color: #999; padding: 20px; border-top: 1px solid #e0e0e0; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>📊 Zia's Automated Dashboard</h1>
            <p>Personal Cockpit — সকল ব্যবসা, খবর, কাজ এক জায়গায়</p>
        </header>

        <div class="section">
            <h2>📊 Business Metrics</h2>
            <div class="tabs">
                <button class="tab-button active" onclick="switchTab(event, 'amanah-metrics')">Amanah Smart Life</button>
                <button class="tab-button" onclick="switchTab(event, 'skyview-metrics')">Sky View Real Estate</button>
                <button class="tab-button" onclick="switchTab(event, 'nexa-metrics')">Nexa AI Solutions</button>
                <button class="tab-button" onclick="switchTab(event, 'apex-metrics')">APEX Development</button>
            </div>
<div id="amanah-metrics" class="tab-content active">
                <div class="metric-card">
                    <h3>Today's Orders</h3>
                    <div class="metric-value">12</div>
                    <div class="metric-label">Orders today</div>
                </div>
            </div>
            <div id="skyview-metrics" class="tab-content">
                <div class="placeholder">Sky View data coming soon</div>
            </div>
            <div id="nexa-metrics" class="tab-content">
                <div class="placeholder">Nexa AI data coming soon</div>
            </div>
            <div id="apex-metrics" class="tab-content">
                <div class="placeholder">APEX data coming soon</div>
            </div>
        </div>

        <footer>
            <p>Zia's Automated Dashboard v1.0 | Built by Hadi</p>
        </footer>
    </div>

    <script>
        function switchTab(event, tabName) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(button => button.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
